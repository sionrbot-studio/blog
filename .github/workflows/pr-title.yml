name: PR title

on:
  merge_group:
    types: [checks_requested]
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            async function queuedPullRequestTitle() {
              const group = context.payload.merge_group;
              if (group.base_ref !== 'refs/heads/main' || !/^[0-9a-f]{40}$/.test(group.head_sha) || group.head_sha !== context.sha) {
                throw new Error('Expected a main merge group matching the checked SHA.');
              }

              const query = `
                query($owner: String!, $repo: String!, $after: String) {
                  repository(owner: $owner, name: $repo) {
                    mergeQueue(branch: "main") {
                      entries(first: 100, after: $after) {
                        nodes { headCommit { oid } pullRequest { number title headRefName } }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }`;
              const matches = [];
              let after = null;
              do {
                const { repository } = await github.graphql(query, { ...context.repo, after });
                if (!repository?.mergeQueue) throw new Error('Cannot read the main merge queue.');
                const { nodes, pageInfo } = repository.mergeQueue.entries;
                for (const entry of nodes) {
                  if (entry.headCommit?.oid === group.head_sha) matches.push(entry.pullRequest);
                }
                if (!pageInfo.hasNextPage) break;
                if (!pageInfo.endCursor || pageInfo.endCursor === after) throw new Error('Incomplete merge queue pagination.');
                after = pageInfo.endCursor;
              } while (true);

              if (matches.length !== 1) {
                throw new Error(`Expected one queued PR for ${group.head_sha}; found ${matches.length}.`);
              }
              core.info(`Checking title of PR #${matches[0].number} for queue SHA ${group.head_sha}.`);
              return matches[0];
            }

            const versionBranch = 'release-please--branches--release--components--sionrbot-blog';
            const conventional = /^(feat|fix|perf|revert|content|docs|chore|test|ci|build|refactor|style)(\([^()\r\n]+\))?!?: \S[^\r\n]*$/u;
            const isBackMergeTitle = (title) => /^chore(\(release\))?: back-merge\b/iu.test(title);
            const isBackMergeRef = (ref) => ref === 'release' || (ref ?? '').startsWith('back-merge/');

            if (context.eventName === 'merge_group') {
              const queued = await queuedPullRequestTitle();
              if (isBackMergeRef(queued.headRefName) || isBackMergeTitle(queued.title)) {
                core.setFailed('Back-merge PRs from release must not enter the squash merge queue; merge with a merge commit to preserve release ancestry.');
                return;
              }
              if (!conventional.test(queued.title)) {
                core.setFailed('Use a Conventional Commit title, e.g. feat: add search, fix: correct dates, or content: publish an article. See docs/releasing.md.');
              }
              return;
            }

            const pr = context.payload.pull_request;
            const title = pr.title;
            const baseRef = pr.base?.ref ?? '';
            const headRef = pr.head?.ref ?? '';
            if (!conventional.test(title)) {
              core.setFailed('Use a Conventional Commit title, e.g. feat: add search, fix: correct dates, or content: publish an article. See docs/releasing.md.');
              return;
            }
            if (baseRef === 'release') {
              if (headRef.startsWith('promote/') && !/^chore\(release\): promote \S/u.test(title)) {
                core.setFailed('Promotion PRs into release must use title format "chore(release): promote <summary>".');
              } else if (headRef.startsWith('content/') && !/^content(\([^()\r\n]+\))?: \S/u.test(title)) {
                core.setFailed('Direct content/* PRs into release must use a non-breaking "content: <summary>" title.');
              } else if (headRef === versionBranch && !/^chore\(release\): release \d+\.\d+\.\d+/u.test(title)) {
                core.setFailed('Version PRs into release must use title format "chore(release): release <version>".');
              }
            } else if (baseRef === 'main' && isBackMergeRef(headRef) && !/^chore\(release\): back-merge \S/u.test(title)) {
              core.setFailed('Back-merge PRs into main must use title format "chore(release): back-merge <summary>".');
            }
