name: Release fixed source
run-name: ${{ github.event_name == 'workflow_dispatch' && format('content {0}', inputs.sha) || format('software {0}', github.event.pull_request.merge_commit_sha) }}

on:
  pull_request:
    branches: [release]
    types: [closed]
  workflow_dispatch:
    inputs:
      sha:
        description: Full release HEAD SHA approved for content deployment
        required: true
        type: string

permissions:
  contents: read

# Covers validation, publication and both deployments. Maintenance has its own group.
concurrency:
  group: release-production
  queue: max
  cancel-in-progress: false

env:
  SITE_URL: https://sionrbot.github.io
  CF_SEND_TELEMETRY: 'false'

jobs:
  admit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'release' &&
      github.event.pull_request.head.ref == 'release-please--branches--release--components--sionrbot-blog' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.candidate.outputs.kind }}
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      tag-sha: ${{ steps.candidate.outputs.tag-sha }}
      pr: ${{ steps.candidate.outputs.pr }}
      attempt: ${{ steps.prepared.outputs.attempt }}
    steps:
      - id: admission
        name: Validate content execution ref and fixed input before checkout
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/release || ! "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ || "$CANDIDATE_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::Content deployment requires the release ref and its complete event SHA.'
            exit 1
          fi
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/release`, {
            headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`Cannot verify release HEAD: ${response.status}`);
          const ref = await response.json();
          if (ref.object?.type !== 'commit' || ref.object.sha !== process.env.CANDIDATE_SHA) throw new Error('Content candidate must equal live release HEAD');
          NODE
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: candidate
        name: Fix and validate the software or content candidate
        run: node scripts/release-fixed.ts candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: prepared
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  verify_checks:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: checks_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.admit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: checks_dependencies
        uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - id: checks
        name: Check source, translations, logic and timezones
        run: |
          vp run check
          vp check
          vp run lint:astro
          vp run i18n:check
          vp run --no-cache test:unit
          vp run --no-cache test:unit:tz

  verify_build:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: build_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.admit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: build_dependencies
        uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - id: baseline_build
        name: Build root-path test site
        run: vp run build
      - id: build_tests
        name: Verify built contracts and internal links
        run: |
          vp run --no-cache test:build
          vp dlx linkinator@8.1.0 dist --recurse --skip '^https?://(?!(localhost|127\.0\.0\.1|\[::1\])[:/])'
      - id: build_diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  verify_browser:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: &playwright_image mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            target: desktop,narrow,webkit
          - variant: i18n
            target: desktop,narrow,webkit
          - variant: configured-forms
            target: desktop,narrow,webkit
          - variant: rendering
            target: desktop,narrow,webkit
          - variant: production-path
            target: desktop
    steps:
      - id: browser_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.admit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: browser_dependencies
        uses: ./.github/actions/dependencies
        with:
          environment: *playwright_image
      - id: browsers
        name: Verify preinstalled browser versions
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { accessSync, constants } from 'node:fs';
          const require = createRequire(import.meta.url);
          const webRequire = createRequire(require.resolve('@e2e-dev/web'));
          const { version } = webRequire('playwright-core/package.json');
          if (version !== '1.65.0') throw new Error(`Update the container image for Playwright ${version}`);
          const { chromium, webkit } = webRequire('playwright-core');
          for (const browser of [chromium, webkit]) accessSync(browser.executablePath(), constants.X_OK);
          NODE
      - id: browser_suite
        name: Run browser regression suite
        env:
          VARIANT: ${{ matrix.variant }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$VARIANT" == default ]]; then vp run build; fi
          vp run --no-cache test:e2e --variant "$VARIANT" --target "$TARGET"
      - id: browser_diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-browser-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  build_pages:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: pages_build_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.admit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: pages_build_dependencies
        uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - id: pages_build
        name: Build and check independent Pages output
        env:
          SITE_URL: https://sionrbot.github.io/blog/
          SOURCE_SHA: ${{ needs.admit.outputs.sha }}
        run: |
          vp run build
          vp test --project build tests/build/base-path.test.ts tests/build/routes.test.ts tests/build/seo.test.ts
          node scripts/check-production-output.ts dist "$SITE_URL"
          mkdir -p release-output
          test -s dist/rss.xml
          test -s dist/articles/freedom/index.html
          cp -R dist release-output/pages
          printf '%s %s %s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > release-output/pages/release-id.txt
      - id: pages_upload
        name: Preserve this run's Pages output
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-output/pages

  build_workers:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      workers-artifact: ${{ steps.workers_upload.outputs.artifact-id }}
    steps:
      - id: workers_build_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.admit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: workers_build_dependencies
        uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - id: workers_build
        name: Build and check Workers prebuilt output
        env:
          SITE_URL: https://sionrbot-blog.pgsnotfound404.workers.dev/
        run: |
          vp run build
          vp test --project build tests/build/base-path.test.ts tests/build/routes.test.ts tests/build/seo.test.ts
          node scripts/check-production-output.ts dist "$SITE_URL"
          rm -rf .cloudflare/output
          vp exec cf build
          test -d .cloudflare/output/v1
          vp exec cf deploy --prebuilt --dry-run
      - id: workers_upload
        name: Preserve this run's Workers prebuilt output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workers-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloudflare/output/v1/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  prepare:
    needs: [admit, verify_checks, verify_build, verify_browser, build_pages, build_workers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      kind: ${{ needs.admit.outputs.kind }}
      sha: ${{ needs.admit.outputs.sha }}
      version: ${{ needs.admit.outputs.version }}
      tag: ${{ needs.admit.outputs.tag }}
      tag-sha: ${{ needs.admit.outputs.tag-sha }}
      pr: ${{ needs.admit.outputs.pr }}
      publish: ${{ steps.publish.outcome }}
      attempt: ${{ needs.admit.outputs.attempt }}
      workers-artifact: ${{ needs.build_workers.outputs.workers-artifact }}
    steps:
      - id: prepare_attempt
        name: Require all verification and build outputs from this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.admit.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo '::error::Re-run all jobs to validate and rebuild this fixed candidate before publication or deployment.'
            exit 1
          fi
      - id: publish_checkout
        if: ${{ needs.admit.outputs.kind == 'software' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.admit.outputs.sha }}
          persist-credentials: false
      - id: publish
        if: ${{ needs.admit.outputs.kind == 'software' }}
        name: Publish or confirm the validated fixed version
        run: node scripts/release-fixed.ts publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # Independent jobs preserve each platform's failure and still attempt the other.
  # Only this job receives Pages write/OIDC permissions; validation does not.
  pages:
    needs: prepare
    outputs:
      gate: ${{ steps.pages_latest.outputs.deploy }}
      deploy: ${{ steps.pages_deploy.outcome }}
      smoke: ${{ steps.pages_smoke.outcome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages_deploy.outputs.page_url }}
    steps:
      - id: pages_attempt
        name: Require validation and outputs from this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo '::error::Re-run all jobs to validate and rebuild this fixed candidate before deployment.'
            exit 1
          fi
      - id: pages_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: pages_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - id: pages_latest
        name: Check software baseline and release HEAD before Pages deployment
        run: node scripts/release-fixed.ts latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_TAG_SHA: ${{ needs.prepare.outputs.tag-sha }}
      - id: pages_deploy
        if: ${{ steps.pages_latest.outputs.deploy == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: pages_smoke
        if: ${{ steps.pages_deploy.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          PAGE_URL: ${{ steps.pages_deploy.outputs.page_url }}
        run: |
          node scripts/check-live-pages.ts source "$PAGE_URL"
          node scripts/smoke-site.ts "$PAGE_URL"

  mirror:
    needs: [prepare, pages]
    if: ${{ needs.pages.outputs.deploy == 'success' && needs.pages.outputs.smoke == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      deployment: false
    outputs:
      gate: ${{ steps.mirror_latest.outputs.deploy }}
      push: ${{ steps.mirror_push.outcome }}
      verify: ${{ steps.mirror_verify.outcome }}
      sha: ${{ steps.mirror_push.outputs.sha }}
    steps:
      - id: mirror_attempt
        name: Require validation and outputs from this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo '::error::Re-run all jobs to validate and rebuild this fixed candidate before deployment.'
            exit 1
          fi
      - id: mirror_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: mirror_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
      - id: mirror_download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-artifact
      - id: mirror_stage
        if: ${{ steps.mirror_download.outcome == 'success' }}
        name: Stage the verified artifact in the personal site's blog directory
        run: |
          git clone --single-branch --branch main https://github.com/sionrbot/sionrbot.github.io.git "$RUNNER_TEMP/personal-site"
          python3 scripts/stage-personal-pages.py "$RUNNER_TEMP/pages-artifact/artifact.tar" "$RUNNER_TEMP/personal-site"
      - id: mirror_latest
        if: ${{ steps.mirror_stage.outcome == 'success' }}
        name: Recheck release eligibility before writing to the personal site
        run: node scripts/release-fixed.ts latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_TAG_SHA: ${{ needs.prepare.outputs.tag-sha }}
      - id: mirror_push
        if: ${{ steps.mirror_latest.outputs.deploy == 'true' }}
        name: Push the verified blog tree to the personal site
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAGES_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          : "${GH_TOKEN:?Configure PERSONAL_PAGES_TOKEN for the personal site}"
          cd "$RUNNER_TEMP/personal-site"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Mirror blog at $SOURCE_SHA" -m "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          fi
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: mirror_verify
        if: ${{ steps.mirror_push.outcome == 'success' }}
        name: Verify the personal Pages deployment for the target commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.mirror_push.outputs.sha }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          MIRROR_BLOG_DIR: ${{ runner.temp }}/personal-site/blog
        run: |
          bash scripts/verify-personal-pages.sh "$TARGET_SHA"
          node scripts/check-live-pages.ts personal https://sionrbot.github.io/blog/

  workers:
    needs: prepare
    outputs:
      gate: ${{ steps.workers_latest.outputs.deploy }}
      deploy: ${{ steps.workers_deploy.outcome }}
      smoke: ${{ steps.workers_smoke.outcome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: workers_attempt
        name: Require validation and outputs from this attempt
        env:
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          if [ "$PREPARED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo '::error::Re-run all jobs to validate and rebuild this fixed candidate before deployment.'
            exit 1
          fi
      - id: workers_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: workers_dependencies
        uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - id: workers_download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.workers-artifact }}
          path: .cloudflare/output/v1/
      - id: workers_latest
        name: Check software baseline and release HEAD before Workers deployment
        run: node scripts/release-fixed.ts latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_TAG_SHA: ${{ needs.prepare.outputs.tag-sha }}
      - id: workers_deploy
        if: ${{ steps.workers_latest.outputs.deploy == 'true' }}
        run: vp exec cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: workers_smoke
        if: ${{ steps.workers_deploy.outcome == 'success' }}
        run: node scripts/smoke-site.ts https://sionrbot-blog.pgsnotfound404.workers.dev/

  refresh:
    if: ${{ needs.prepare.outputs.kind == 'software' }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-pr-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release
          persist-credentials: false
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - name: Refresh the next version PR after clearing pending
        run: node scripts/release.ts pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  summary:
    if: ${{ always() }}
    needs:
      [
        admit,
        verify_checks,
        verify_build,
        verify_browser,
        build_pages,
        build_workers,
        prepare,
        pages,
        mirror,
        workers,
        refresh,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: delivery_summary
        name: Record candidate and independent target results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.merge_commit_sha }}
          CANDIDATE_KIND: ${{ github.event_name == 'workflow_dispatch' && 'content' || 'software' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const candidate = jobs.admit?.outputs ?? {};
          const sha = /^[a-f0-9]{40}$/.test(process.env.CANDIDATE_SHA ?? '') ? process.env.CANDIDATE_SHA : 'invalid input';
          const rows = ['pages', 'workers'].map(target => {
            const job = jobs[target];
            const output = job.outputs;
            const gate = output.gate === 'false' ? 'superseded; deployment skipped' : output.gate === 'true' ? 'eligible' : 'not established';
            return `| ${target} | ${job.result} | ${gate} | ${output.deploy || 'not run'} | ${output.smoke || 'not run'} |`;
          });
          const prepJobs = ['admit', 'verify_checks', 'verify_build', 'verify_browser', 'build_pages', 'build_workers', 'prepare'].map(
            name => `| ${name} | ${jobs[name]?.result ?? 'not run'} |`,
          );
          const publication = process.env.CANDIDATE_KIND === 'content' ? 'not applicable (content)' : jobs.prepare?.outputs?.publish || 'not run';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Fixed candidate', '',
            `- Kind: ${process.env.CANDIDATE_KIND}`,
            `- Source SHA: ${sha}`,
            `- Software version: ${candidate.version || 'not established'}`,
            `- Software tag: ${candidate.tag || 'not established'}`,
            `- Software tag SHA: ${candidate['tag-sha'] || 'not established'}`,
            `- Version PR: ${candidate.pr || 'not applicable / not established'}`,
            `- Run / attempt: ${process.env.GITHUB_RUN_ID} / ${process.env.GITHUB_RUN_ATTEMPT}`,
            `- Preparation gate: ${jobs.prepare.result}`,
            `- Personal Pages mirror: ${jobs.mirror.result} (eligible: ${jobs.mirror.outputs.gate || 'not established'}, push: ${jobs.mirror.outputs.push || 'not run'}, verification: ${jobs.mirror.outputs.verify || 'not run'}, target commit: ${jobs.mirror.outputs.sha || 'none'})`,
            `- Software publication: ${publication}`,
            `- Version PR refresh: ${jobs.refresh.result}`, '',
            '## Preparation jobs', '',
            '| Job | Result |',
            '| --- | --- |', ...prepJobs, '',
            '| Target | Job | Eligibility | Deployment | Smoke |',
            '| --- | --- | --- | --- | --- |', ...rows, '',
            'Job success alone does not certify deployment: inspect eligibility, deployment and smoke separately.', '',
          ].join('\n'));
          NODE
