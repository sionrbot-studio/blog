name: Maintain release PR

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: release-pr-release
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release
          persist-credentials: false
      - id: setup_vp
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Maintain version PR without publishing
        run: node scripts/release.ts pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
