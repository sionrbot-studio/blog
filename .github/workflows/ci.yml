name: CI

on:
  merge_group:
    types: [checks_requested]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build and preview share this root-path baseline; fixture variants stay isolated.
env:
  SITE_URL: https://sionrbot.github.io

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      browser_matrix: ${{ steps.select.outputs.browser_matrix }}
      browser-image: ${{ steps.images.outputs.profile }}
      playwright-version: ${{ steps.images.outputs.version }}
      playwright-integrity: ${{ steps.images.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: select
        run: node scripts/ci-scope.ts

      - id: images
        name: Resolve pinned browser tools and image
        if: contains(fromJSON('["default","i18n","configured-forms","rendering","production-path","full"]'), steps.select.outputs.scope)
        run: |
          ruby -ryaml -e '
            lock = YAML.load_file("pnpm-lock.yaml")
            web = lock.fetch("importers").fetch(".").fetch("devDependencies").fetch("@e2e-dev/web").fetch("version")
            version = lock.fetch("snapshots").fetch("@e2e-dev/web@#{web}").fetch("dependencies").fetch("playwright-core")
            integrity = lock.fetch("packages").fetch("playwright-core@#{version}").fetch("resolution").fetch("integrity")
            puts "version=#{version}", "integrity=#{integrity}"
          ' >> "$GITHUB_OUTPUT"
          profile=$(python3 scripts/ci-playwright-images.py)
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

  format:
    needs: scope
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp fmt --check
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  lint:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: vp run astro sync
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Check formatting, lint and TypeScript
        run: |
          bash scripts/ci-budget.sh 5000 bash -c '
            vp check & combined=$!
            vp run --no-cache lint:astro & astro=$!
            status=0
            wait "$combined" || status=1
            wait "$astro" || status=1
            exit "$status"
          '
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  types:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: bash scripts/ci-budget.sh 5000 vp run --no-cache check
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  unit:
    needs: scope
    if: needs.scope.outputs.scope == 'unit' || needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp run i18n:check
      - id: unit_tests
        run: bash scripts/ci-budget.sh 60000 vp run --no-cache test:unit
      - if: ${{ !cancelled() && steps.unit_tests.outcome != 'skipped' }}
        run: bash scripts/ci-budget.sh 60000 vp run --no-cache test:unit:tz
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  build:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp run build
      - name: Verify internal links
        run: vp dlx linkinator@8.1.0 dist --recurse --skip '^https?://(?!(localhost|127\.0\.0\.1|\[::1\])[:/])'
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  contracts:
    needs: scope
    if: needs.scope.outputs.scope == 'contracts' || needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp run build
      - run: bash scripts/ci-budget.sh 60000 vp run --no-cache test:build --shard=${{ matrix.shard }}/2
      - name: Preserve diagnostic reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  browser:
    needs: scope
    if: contains(fromJSON('["default","i18n","configured-forms","rendering","production-path","full"]'), needs.scope.outputs.scope)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      IMAGE_PROFILE: ${{ needs.scope.outputs.browser-image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.browser_matrix) }}
    steps:
      - name: Start preparing locked browser tools
        env:
          PW_VERSION: ${{ needs.scope.outputs.playwright-version }}
          PW_INTEGRITY: ${{ needs.scope.outputs.playwright-integrity }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/container-tools
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: ${{ contains(matrix.target, 'webkit') && '1' || '0' }}
          TARGET: ${{ matrix.target }}
          TOOL: ${{ matrix.target == 'webkit' && 'ffmpeg' || 'chromium' }}
        run: |
          mkfifo "$RUNNER_TEMP/browser-tools-status"
          if [[ ",$TARGET," != *,webkit,* ]]; then mkfifo "$RUNNER_TEMP/chromium-font-status"; fi
          (
            set +e
            (
              set -eo pipefail
              start=$(date +%s%3N)
              cli=$(mktemp -d)
              curl --fail --silent --show-error --location --output "$cli/core.tgz" \
                "https://registry.npmjs.org/playwright-core/-/playwright-core-$PW_VERSION.tgz"
              digest=$(openssl dgst -sha512 -binary "$cli/core.tgz" | openssl base64 -A)
              if [[ "sha512-$digest" != "$PW_INTEGRITY" ]]; then
                echo "Playwright CLI integrity check failed" >&2
                exit 1
              fi
              tar -xzf "$cli/core.tgz" -C "$cli"
              engines=("$TOOL")
              if [[ ",$TARGET," == *,webkit,* ]]; then engines=(webkit "$TOOL"); fi
              node "$cli/package/cli.js" install --only-shell --no-progress "${engines[@]}"
              echo "Browser tools started: $start ms; elapsed: $(( $(date +%s%3N) - start )) ms"
              if [[ ",$TARGET," != *,webkit,* ]]; then
                read -r status < "$RUNNER_TEMP/chromium-font-status"
                cat "$RUNNER_TEMP/chromium-font.log"
                if [[ "$status" != 0 ]]; then exit "$status"; fi
                node --input-type=module - "$cli/package/index.mjs" <<'NODE'
          const start = performance.now();
          const { chromium } = await import(process.argv[2]);
          const browser = await chromium.launch();
          console.log(`Chromium ${browser.version()} launched in ${Math.round(performance.now() - start)} ms`);
          await browser.close();
          NODE
              fi
            )
            echo "$?" > "$RUNNER_TEMP/browser-tools-status"
          ) </dev/null > "$RUNNER_TEMP/browser-tools.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.target != 'webkit'
        with: &browser_checkout
          fetch-depth: 0
          filter: blob:none
      - name: Pull and start the pinned browser image in the background
        if: contains(matrix.target, 'webkit')
        run: |
          PLAYWRIGHT_IMAGE=$(jq -r .image <<< "$IMAGE_PROFILE")
          echo "PLAYWRIGHT_IMAGE=$PLAYWRIGHT_IMAGE" >> "$GITHUB_ENV"
          echo "Compressed image size: $(jq -r .bytes <<< "$IMAGE_PROFILE") bytes"
          export DOCKER_HOST=unix:///run/ci-browser.sock
          echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          mkfifo "$RUNNER_TEMP/browser-start-status"
          (
            start=$(date +%s%3N)
            set +e
            (
              set -e
              data=/run/ci-browser-data
              sudo mkdir -p "$data"
              sudo mount -t tmpfs -o size=4G,mode=0700 tmpfs "$data"
              echo '{"features":{"containerd-snapshotter":false}}' > "$RUNNER_TEMP/browser-daemon.json"
              sudo dockerd --config-file "$RUNNER_TEMP/browser-daemon.json" \
                --host "$DOCKER_HOST" --data-root "$data" --storage-driver overlay2 \
                --exec-root /run/ci-browser-engine --pidfile /run/ci-browser.pid \
                --containerd-namespace ci-browser --containerd-plugins-namespace ci-browser-plugins \
                --bridge none --iptables=false --ip6tables=false --ip-masq=false --ip-forward=false \
                > "$RUNNER_TEMP/browser-daemon.log" 2>&1 &
              for attempt in {1..100}; do
                if docker info --format '{{.Driver}} {{.DockerRootDir}}' > "$RUNNER_TEMP/browser-store" 2>/dev/null; then break; fi
                sleep 0.1
              done
              if ! grep -Fxq "overlay2 $data" "$RUNNER_TEMP/browser-store"; then
                cat "$RUNNER_TEMP/browser-daemon.log" >&2
                exit 1
              fi
              echo "Browser image store: $(findmnt -n -o FSTYPE --target "$data"); ready in $(( $(date +%s%3N) - start )) ms"
              jq -r .nginx <<< "$IMAGE_PROFILE" | base64 --decode > "$RUNNER_TEMP/browser-registry.conf"
              nginx -p "$RUNNER_TEMP/" -c "$RUNNER_TEMP/browser-registry.conf" -e stderr
              set -o pipefail
              docker pull --platform linux/amd64 "$PLAYWRIGHT_IMAGE" 2>&1 |
                while IFS= read -r line; do printf '%s %s\n' "$EPOCHREALTIME" "$line"; done
              pulled=$(date +%s%3N)
              echo "Browser image pull: $((pulled - start)) ms"
              toolchain="$HOME/.local/share/vite-plus"
              toolcache="$HOME/.cache/vite-plus"
              mkdir -p "$RUNNER_TEMP/browser-home" "$RUNNER_TEMP/container-tools" "$toolchain" "$toolcache"
              docker run --detach --pull=never --name ci-browser --ipc=host --network host \
                --env PLAYWRIGHT_BROWSERS_PATH=/ci-browser-tools \
                --volume "$RUNNER_TEMP/container-tools:/ci-browser-tools:ro" \
                --user "$(id -u):$(id -g)" --env HOME --env CI --env SITE_URL \
                --env PATH="$toolchain/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
                --volume "$RUNNER_TEMP/browser-home:$HOME" \
                --volume "$toolchain:$toolchain" --volume "$toolcache:$toolcache" \
                --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
                "$PLAYWRIGHT_IMAGE" sleep infinity
              echo "Browser container start: $(( $(date +%s%3N) - pulled )) ms"
            )
            status=$?
            echo "$status" > "$RUNNER_TEMP/browser-start-status"
          ) </dev/null > "$RUNNER_TEMP/browser-start.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.target == 'webkit'
        with: *browser_checkout
      - name: Start preparing the host Chromium font
        if: ${{ !contains(matrix.target, 'webkit') }}
        run: |
          (
            set +e
            bash scripts/ci-install-chromium-font.sh
            echo "$?" > "$RUNNER_TEMP/chromium-font-status"
          ) </dev/null > "$RUNNER_TEMP/chromium-font.log" 2>&1 &
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - name: Wait for the browser tools
        run: |
          read -r status < "$RUNNER_TEMP/browser-tools-status"
          cat "$RUNNER_TEMP/browser-tools.log"
          exit "$status"
      - name: Wait for the browser container
        if: contains(matrix.target, 'webkit')
        run: |
          read -r status < "$RUNNER_TEMP/browser-start-status"
          cat "$RUNNER_TEMP/browser-start.log"
          if [ "$status" != 0 ]; then exit "$status"; fi
      - id: browsers
        name: Verify preinstalled browser versions
        if: contains(matrix.target, 'webkit')
        run: |
          docker exec ci-browser sh -ec 'test "$(fc-match -f "%{file}" "WenQuanYi Zen Hei")" = /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc'
          docker exec -i ci-browser vp exec node --input-type=module - '${{ matrix.target }}' <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const webRequire = createRequire(require.resolve('@e2e-dev/web'));
          const { version } = webRequire('playwright-core/package.json');
          if (version !== '1.65.0') throw new Error(`Update the container image for Playwright ${version}`);
          const { chromium, webkit } = webRequire('playwright-core');
          const webkitBrowser = await webkit.launch();
          await webkitBrowser.close();
          if (process.argv[2] !== 'webkit') {
            const browser = await chromium.launch();
            await browser.close();
          }
          NODE
      - name: Verify the restored host Playwright version
        if: ${{ !contains(matrix.target, 'webkit') }}
        env:
          PW_VERSION: ${{ needs.scope.outputs.playwright-version }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/container-tools
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const web = createRequire(require.resolve('@e2e-dev/web'));
          const { version } = web('playwright-core/package.json');
          if (version !== process.env.PW_VERSION) throw new Error(`Expected Playwright ${process.env.PW_VERSION}, got ${version}`);
          NODE
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Run browser shard
        env:
          VARIANT: ${{ matrix.variant }}
          TARGET: ${{ matrix.target }}
        run: |
          runner=()
          if [[ ",$TARGET," == *,webkit,* ]]; then runner=(docker exec ci-browser); fi
          if [[ "$VARIANT" == default ]]; then "${runner[@]}" vp run build; fi
          bash scripts/ci-budget.sh 60000 "${runner[@]}" vp run --no-cache test:e2e --variant "$VARIANT" --target "$TARGET"
      - name: Preserve diagnostic reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  verify:
    if: always()
    needs: [scope, format, lint, types, unit, build, contracts, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every selected job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.NEEDS);
          const scope = jobs.scope?.outputs?.scope;
          const browserTargets = {
            default: ['desktop', 'narrow', 'webkit'],
            i18n: ['desktop,narrow,webkit'],
            'configured-forms': ['desktop,narrow,webkit'],
            rendering: ['desktop,narrow,webkit'],
            'production-path': ['desktop'],
          };
          const browserScope = Object.hasOwn(browserTargets, scope);
          if (!['docs', 'unit', 'contracts', 'full'].includes(scope) && !browserScope) {
            throw new Error('Unknown verification scope: ' + scope);
          }
          if (process.env.GITHUB_EVENT_NAME !== 'pull_request' && scope !== 'full') {
            throw new Error('Only pull requests may use reduced verification');
          }
          const expectedBrowsers = Object.entries(browserTargets)
            .filter(([variant]) => scope === 'full' || variant === scope)
            .flatMap(([variant, targets]) => targets.map(target => ({ variant, target })));
          const plannedBrowsers = JSON.parse(jobs.scope.outputs.browser_matrix).include;
          if (!Array.isArray(plannedBrowsers) || plannedBrowsers.length !== expectedBrowsers.length ||
              !expectedBrowsers.every(({ variant, target }) =>
                plannedBrowsers.some(row => row.variant === variant && row.target === target))) {
            throw new Error('Browser matrix does not cover the selected scope: ' + scope);
          }
          const selected = ['scope', 'format'];
          if (scope !== 'docs') selected.push('lint', 'types');
          if (scope === 'unit') selected.push('unit');
          if (scope === 'contracts') selected.push('contracts');
          if (browserScope) selected.push('browser');
          for (const name of ['scope', 'format', 'lint', 'types', 'unit', 'build', 'contracts', 'browser']) {
            const job = jobs[name];
            if (!job) throw new Error('Missing required job: ' + name);
            const expected = scope === 'full' || selected.includes(name) ? 'success' : 'skipped';
            if (job.result !== expected) throw new Error(name + ' returned ' + job.result + ', expected ' + expected);
          }
          NODE
