name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build and preview share this root-path baseline; fixture variants stay isolated.
env:
  SITE_URL: https://sionrbot.github.io

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      browser_matrix: ${{ steps.select.outputs.browser_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: select
        run: node scripts/ci-scope.ts

  format:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp fmt --check
      - uses: ./.github/actions/check-setup-budget

  lint:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: vp run astro sync
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Check formatting, lint and TypeScript
        run: |
          bash scripts/ci-budget.sh 5000 bash -c '
            vp check & combined=$!
            vp run --no-cache lint:astro & astro=$!
            status=0
            wait "$combined" || status=1
            wait "$astro" || status=1
            exit "$status"
          '
      - uses: ./.github/actions/check-setup-budget

  types:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: bash scripts/ci-budget.sh 5000 vp run --no-cache check
      - uses: ./.github/actions/check-setup-budget

  unit:
    needs: scope
    if: contains(fromJSON('["unit","full"]'), needs.scope.outputs.scope)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp run i18n:check
      - run: bash scripts/ci-budget.sh 60000 vp run --no-cache test:unit
      - run: bash scripts/ci-budget.sh 60000 vp run --no-cache test:unit:tz
      - uses: ./.github/actions/check-setup-budget

  build:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp run build
      - name: Verify internal links
        run: vp dlx linkinator@8.1.0 dist --recurse --skip '^https?://(?!(localhost|127\.0\.0\.1|\[::1\])[:/])'
      - uses: ./.github/actions/check-setup-budget

  contracts:
    needs: scope
    if: contains(fromJSON('["contracts","full"]'), needs.scope.outputs.scope)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp run build
      - run: bash scripts/ci-budget.sh 60000 vp run --no-cache test:build --shard=${{ matrix.shard }}/2
      - name: Preserve diagnostic reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - uses: ./.github/actions/check-setup-budget

  browser:
    needs: scope
    if: contains(fromJSON('["default","i18n","configured-forms","rendering","production-path","full"]'), needs.scope.outputs.scope)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - uses: ./.github/actions/playwright
        with:
          engines: ${{ matrix.target == 'webkit' && 'webkit' || contains(matrix.target, ',') && 'chromium webkit' || 'chromium' }}
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - if: matrix.variant == 'default'
        run: vp run build
      - run: bash scripts/ci-budget.sh 60000 vp run --no-cache test:e2e --variant ${{ matrix.variant }} --target ${{ matrix.target }}
      - name: Preserve diagnostic reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - uses: ./.github/actions/check-setup-budget

  verify:
    if: always()
    needs: [scope, format, lint, types, unit, build, contracts, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every selected job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.NEEDS);
          const scope = jobs.scope.outputs.scope;
          const browserVariants = ['default', 'i18n', 'configured-forms', 'rendering', 'production-path'];
          const browser = browserVariants.includes(scope);
          if (!['docs', 'unit', 'contracts', 'full'].includes(scope) && !browser) process.exit(1);
          if (process.env.GITHUB_EVENT_NAME !== 'pull_request' && scope !== 'full') process.exit(1);
          const required = new Set(['scope', 'format']);
          if (scope !== 'docs') ['lint', 'types'].forEach(name => required.add(name));
          if (scope === 'unit') required.add('unit');
          if (scope === 'contracts') required.add('contracts');
          if (browser) required.add('browser');
          for (const [name, job] of Object.entries(jobs)) {
            const omitted = scope !== 'full' && !required.has(name);
            const expected = omitted ? 'skipped' : 'success';
            if (job.result !== expected) throw new Error(name + ' returned ' + job.result + ', expected ' + expected);
          }
          NODE
