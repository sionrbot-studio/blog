name: CI

on:
  merge_group:
    types: [checks_requested]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build and preview share this root-path baseline; fixture variants stay isolated.
env:
  SITE_URL: https://sionrbot.github.io

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Keep aligned with @e2e-dev/web's playwright-core dependency.
    container:
      image: &playwright_image mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/dependencies
        with:
          environment: *playwright_image
      - id: scope
        name: Select verification scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            echo 'scope=full' >> "$GITHUB_OUTPUT"
            echo 'CI verification scope: full'
          else
            node scripts/ci-scope.ts
          fi
      - id: vp_task_cache
        name: Restore vp task cache
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ci-vp-task-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-vp-task-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Check documentation formatting
        if: ${{ steps.scope.outputs.scope == 'docs' }}
        run: vp fmt --check
      - name: Check Astro types and templates
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        run: vp run check
      - name: Check formatting, lint and TypeScript
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        run: vp check
      - name: Check Astro template lint rules
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        run: vp run lint:astro
      - name: Check translations
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        run: vp run i18n:check
      - name: Test logic and tools
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        run: vp run ${{ github.event_name == 'merge_group' && '--no-cache' || '' }} test:unit
      - name: Test date contracts across timezones
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        run: vp run ${{ github.event_name == 'merge_group' && '--no-cache' || '' }} test:unit:tz
      - name: Save vp task cache
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vp_task_cache.outputs.cache-primary-key }}
      - id: browsers
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        name: Verify preinstalled browser versions
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { accessSync, constants } from 'node:fs';
          const require = createRequire(import.meta.url);
          const webRequire = createRequire(require.resolve('@e2e-dev/web'));
          const { version } = webRequire('playwright-core/package.json');
          if (version !== '1.65.0') throw new Error(`Update the container image for Playwright ${version}`);
          const { chromium, webkit } = webRequire('playwright-core');
          for (const browser of [chromium, webkit]) accessSync(browser.executablePath(), constants.X_OK);
          NODE
      - id: baseline_build
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        name: Build root-path test site
        run: vp run build
      - id: build_tests
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        name: Verify built contracts and internal links
        run: |
          vp run test:build
          vp dlx linkinator@8.1.0 dist --recurse --skip '^https?://(?!(localhost|127\.0\.0\.1|\[::1\])[:/])'
      - id: default_browser
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        run: vp run test:e2e --variant default --target desktop,narrow,webkit
      - id: i18n_browser
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        run: vp run test:e2e --variant i18n --target desktop,narrow,webkit
      - id: forms_browser
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        run: vp run test:e2e --variant configured-forms --target desktop,narrow,webkit
      - id: rendering_browser
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        run: vp run test:e2e --variant rendering --target desktop,narrow,webkit
      - id: production_path_browser
        if: ${{ steps.scope.outputs.scope != 'docs' }}
        run: vp run test:e2e --variant production-path --target desktop
      - name: Preserve diagnostic reports
        if: ${{ always() && steps.scope.outputs.scope != 'docs' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verify-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
