name: CI

on:
  merge_group:
    types: [checks_requested]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build and preview share this root-path baseline; fixture variants stay isolated.
env:
  SITE_URL: https://sionrbot.github.io

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      browser-image: ${{ steps.images.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: select
        run: |
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            echo 'scope=full' >> "$GITHUB_OUTPUT"
            echo 'CI verification scope: full'
          else
            node scripts/ci-scope.ts
          fi

      - id: images
        name: Resolve pinned WebKit shard image
        if: steps.select.outputs.scope != 'docs'
        run: |
          profile=$(python3 scripts/ci-playwright-images.py)
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

  format:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp fmt --check
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  lint:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: vp run astro sync
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: bash scripts/ci-budget.sh 5000 vp run --no-cache lint
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  types:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: bash scripts/ci-budget.sh 5000 bash -ec 'vp run --no-cache check && vp check'
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  unit:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp run i18n:check
      - id: unit_tests
        run: bash scripts/ci-budget.sh 60000 vp run --no-cache test:unit
      - if: ${{ !cancelled() && steps.unit_tests.outcome != 'skipped' }}
        run: bash scripts/ci-budget.sh 60000 vp run --no-cache test:unit:tz
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  build:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp run build
      - name: Verify internal links
        run: vp dlx linkinator@8.1.0 dist --recurse --skip '^https?://(?!(localhost|127\.0\.0\.1|\[::1\])[:/])'
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  contracts:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: vp run build
      - run: bash scripts/ci-budget.sh 60000 vp run --no-cache test:build --shard=${{ matrix.shard }}/2
      - name: Preserve diagnostic reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  browser:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      IMAGE_PROFILE: ${{ needs.scope.outputs.browser-image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: default, target: desktop }
          - { variant: default, target: narrow }
          - { variant: default, target: webkit }
          - { variant: i18n, target: 'desktop,narrow,webkit' }
          - { variant: configured-forms, target: 'desktop,narrow,webkit' }
          - { variant: rendering, target: 'desktop,narrow,webkit' }
          - { variant: production-path, target: desktop }
    steps:
      - name: Start pulling the pinned browser image
        if: contains(matrix.target, 'webkit')
        run: |
          PLAYWRIGHT_IMAGE=$(jq -r .image <<< "$IMAGE_PROFILE")
          echo "PLAYWRIGHT_IMAGE=$PLAYWRIGHT_IMAGE" >> "$GITHUB_ENV"
          echo "Compressed image size: $(jq -r .bytes <<< "$IMAGE_PROFILE") bytes"
          mkfifo "$RUNNER_TEMP/browser-pull-status"
          (
            start=$(date +%s%3N)
            set +e
            (
              set -e
              jq -r .nginx <<< "$IMAGE_PROFILE" | base64 --decode > "$RUNNER_TEMP/browser-registry.conf"
              nginx -p "$RUNNER_TEMP/" -c "$RUNNER_TEMP/browser-registry.conf" -e stderr
              docker pull --platform linux/amd64 "$PLAYWRIGHT_IMAGE"
            )
            status=$?
            echo "Browser image pull: $(( $(date +%s%3N) - start )) ms"
            echo "$status" > "$RUNNER_TEMP/browser-pull-status"
          ) </dev/null > "$RUNNER_TEMP/browser-pull.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - name: Start the prepared browser container
        if: contains(matrix.target, 'webkit')
        run: |
          read -r status < "$RUNNER_TEMP/browser-pull-status"
          cat "$RUNNER_TEMP/browser-pull.log"
          if [ "$status" != 0 ]; then exit "$status"; fi
          toolchain="$HOME/.local/share/vite-plus"
          toolcache="$HOME/.cache/vite-plus"
          mkdir -p "$RUNNER_TEMP/browser-home" "$toolcache"
          docker run --detach --pull=never --name ci-browser --ipc=host \
            --user "$(id -u):$(id -g)" --env HOME --env CI --env SITE_URL \
            --env PATH="$toolchain/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --volume "$RUNNER_TEMP/browser-home:$HOME" \
            --volume "$toolchain:$toolchain" --volume "$toolcache:$toolcache" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            "$PLAYWRIGHT_IMAGE" sleep infinity
      - id: browsers
        name: Verify preinstalled browser versions
        if: contains(matrix.target, 'webkit')
        run: |
          docker exec ci-browser sh -ec 'test "$(fc-match -f "%{file}" "WenQuanYi Zen Hei")" = /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc'
          docker exec -i ci-browser vp exec node --input-type=module - <<'NODE'
          import { createRequire } from 'node:module';
          import { accessSync, constants } from 'node:fs';
          const require = createRequire(import.meta.url);
          const webRequire = createRequire(require.resolve('@e2e-dev/web'));
          const { version } = webRequire('playwright-core/package.json');
          if (version !== '1.65.0') throw new Error(`Update the container image for Playwright ${version}`);
          const { chromium, webkit } = webRequire('playwright-core');
          for (const browser of [chromium, webkit]) accessSync(browser.executablePath(), constants.X_OK);
          NODE
      - name: Prepare pinned Chromium on the host
        if: ${{ !contains(matrix.target, 'webkit') }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          bash scripts/ci-prepare-chromium.sh
      - run: echo "SETUP_FINISHED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Run browser shard
        env:
          VARIANT: ${{ matrix.variant }}
          TARGET: ${{ matrix.target }}
        run: |
          runner=()
          if [[ ",$TARGET," == *,webkit,* ]]; then runner=(docker exec ci-browser); fi
          if [[ "$VARIANT" == default ]]; then "${runner[@]}" vp run build; fi
          bash scripts/ci-budget.sh 60000 "${runner[@]}" vp run --no-cache test:e2e --variant "$VARIANT" --target "$TARGET"
      - name: Preserve diagnostic reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/check-setup-budget

  verify:
    if: always()
    needs: [scope, format, lint, types, unit, build, contracts, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every selected job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.NEEDS);
          const scope = jobs.scope.outputs.scope;
          if (!['docs', 'full'].includes(scope)) process.exit(1);
          if (process.env.GITHUB_EVENT_NAME === 'merge_group' && scope !== 'full') {
            throw new Error('Merge groups require full verification');
          }
          for (const name of ['scope', 'format', 'lint', 'types', 'unit', 'build', 'contracts', 'browser']) {
            const job = jobs[name];
            if (!job) throw new Error('Missing required job: ' + name);
            const expected = scope === 'docs' && !['scope', 'format'].includes(name) ? 'skipped' : 'success';
            if (job.result !== expected) throw new Error(name + ' returned ' + job.result + ', expected ' + expected);
          }
          NODE
