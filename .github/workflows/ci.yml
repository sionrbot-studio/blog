name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build and preview share this root-path baseline; fixture variants stay isolated.
env:
  SITE_URL: https://sionrbot.github.io

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      browser_matrix: ${{ steps.select.outputs.browser_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: select
        run: node scripts/ci-scope.ts

  format:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: vp fmt --check

  lint:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: vp run astro sync
      - run: vp run lint

  types:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: vp run check
      - run: vp check

  unit:
    needs: scope
    if: contains(fromJSON('["unit","full"]'), needs.scope.outputs.scope)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: vp run i18n:check
      - run: vp run test:unit
      - run: vp run test:unit:tz

  build:
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: vp run build
      - name: Verify internal links
        run: vp dlx linkinator@8.1.0 dist --recurse --skip '^https?://(?!(localhost|127\.0\.0\.1|\[::1\])[:/])'

  contracts:
    needs: scope
    if: contains(fromJSON('["contracts","full"]'), needs.scope.outputs.scope)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - run: vp run build
      - run: vp run test:build --shard=${{ matrix.shard }}/2
      - name: Preserve diagnostic reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  browser:
    needs: scope
    if: contains(fromJSON('["default","i18n","configured-forms","rendering","production-path","full"]'), needs.scope.outputs.scope)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: playwright-1.65.0-noble
      - id: browsers
        name: Verify preinstalled browser versions
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { accessSync, constants } from 'node:fs';
          const require = createRequire(import.meta.url);
          const webRequire = createRequire(require.resolve('@e2e-dev/web'));
          const { version } = webRequire('playwright-core/package.json');
          if (version !== '1.65.0') throw new Error(`Update the container image for Playwright ${version}`);
          const { chromium, webkit } = webRequire('playwright-core');
          for (const browser of [chromium, webkit]) accessSync(browser.executablePath(), constants.X_OK);
          NODE
      - if: matrix.variant == 'default'
        run: vp run build
      - run: vp run test:e2e --variant ${{ matrix.variant }} --target ${{ matrix.target }}
      - name: Preserve diagnostic reports
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/test-results/build/
            .e2e/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  verify:
    if: always()
    needs: [scope, format, lint, types, unit, build, contracts, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every selected job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.NEEDS);
          const scope = jobs.scope.outputs.scope;
          const browserVariants = ['default', 'i18n', 'configured-forms', 'rendering', 'production-path'];
          const browser = browserVariants.includes(scope);
          if (!['docs', 'unit', 'contracts', 'full'].includes(scope) && !browser) process.exit(1);
          if (process.env.GITHUB_EVENT_NAME !== 'pull_request' && scope !== 'full') process.exit(1);
          const required = new Set(['scope', 'format']);
          if (scope !== 'docs') ['lint', 'types'].forEach(name => required.add(name));
          if (scope === 'unit') required.add('unit');
          if (scope === 'contracts') required.add('contracts');
          if (browser) required.add('browser');
          for (const [name, job] of Object.entries(jobs)) {
            const omitted = scope !== 'full' && !required.has(name);
            const expected = omitted ? 'skipped' : 'success';
            if (job.result !== expected) throw new Error(name + ' returned ' + job.result + ', expected ' + expected);
          }
          NODE
