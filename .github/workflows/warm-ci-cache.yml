name: Warm CI dependencies
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browsers:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        engines: [chromium, webkit, 'chromium webkit']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
      - uses: ./.github/actions/playwright
        with:
          engines: ${{ matrix.engines }}
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/dependencies
        with:
          environment: ubuntu-24.04
