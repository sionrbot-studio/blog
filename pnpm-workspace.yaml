packages:
  - '.'
nodeVersion: 26.13.0
runtimeOnFail: ignore
pmOnFail: ignore
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: 'catalog:'
  # x18n UI pins agentic separately from devframe; their peer versions must match.
  '@x18n/ui@0.1.14>@devframes/agentic': 1.3.2
  # GHSA-g3hv-75wg-m249: remove once this consumer supports a patched minimatch.
  '@google-automations/git-file-utils@3.2.1>minimatch': 11.0.5
minimumReleaseAgeExclude:
  - '@cloudflare/build-output-utils@0.9.10'
  - '@cloudflare/config@0.30.2'
  - '@cloudflare/runtime-types@0.1.23'
  - cf@1.0.0-beta.28
  - miniflare@5.20261104.0-beta
  - wrangler@4.158.0
